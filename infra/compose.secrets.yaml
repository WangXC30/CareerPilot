# Opt-in local key injection. Generate .secrets/vault.key outside version control.
services:
  api:
    environment:
      CAREERPILOT_VAULT_KEY_FILE: /run/secrets/vault_key
    secrets: [vault_key]
  worker:
    environment:
      CAREERPILOT_VAULT_KEY_FILE: /run/secrets/vault_key
    secrets: [vault_key]
secrets:
  vault_key:
    file: .secrets/vault.key
