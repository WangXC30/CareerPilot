# From the repository root, pass --project-directory . when using this file alone.
# Optional compatibility gate; leaves the default SQLite environment unchanged.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careerpilot_test
      POSTGRES_USER: careerpilot_test
      POSTGRES_PASSWORD: disposable-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot_test -d careerpilot_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  postgres-check:
    image: careerpilot-dev:local
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      CAREERPILOT_TEST_POSTGRES_URL: postgresql+psycopg://careerpilot_test:disposable-test-only@postgres/careerpilot_test
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/postgres_contract.py"]
