global
    maxconn 256
defaults
    mode http
    timeout connect 2s
    timeout client 15s
    timeout server 15s
    timeout check 2s
    retries 0
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
frontend local_candidate
    bind :8080
    default_backend candidate_apis
backend candidate_apis
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 1s fall 1 rise 1 resolvers docker init-addr libc,none
    server api_a api-a:8000 check
    server api_b api-b:8000 check
