[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot"
version = "0.1.0"
description = "CareerPilot V0 engineering foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "jsonschema>=4,<5", "cryptography>=46,<51", "playwright>=1,<2", "pypdf>=6.21.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1,<3", "pip-audit>=2,<3", "pip-licenses>=5,<6", "psycopg[binary]>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
careerpilot = ["static/*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
files = ["src/careerpilot"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["skills", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
