name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose run --rm --no-deps checks
      - run: docker compose run --rm --no-deps checks python scripts/dependency_report.py
      - run: docker compose --project-directory . -p careerpilot-pg-v0 -f infra/compose.postgres.yaml up --abort-on-container-exit --exit-code-from postgres-check
      - run: docker compose up -d --wait --wait-timeout 120 api worker
      - run: docker compose exec -T api python -m careerpilot.seed
      - run: curl --fail http://127.0.0.1:8000/health/ready
      - run: docker compose exec -T api python scripts/runtime_live_smoke.py
      - run: docker compose exec -T -e CAREERPILOT_ACCEPTANCE=1 api python scripts/runtime_v1_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
      - if: always()
        run: docker compose --project-directory . -p careerpilot-pg-v0 -f infra/compose.postgres.yaml down
